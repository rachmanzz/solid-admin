# Build the SolidJS app with Vite (dist/client) and deploy it to GitHub Pages
name: Deploy static site to GitHub Pages

on:
  # Runs when a GitHub Release is published
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate for manual runs (must match v*-pages)"
        default: "v0.0.0-pages"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build with Vite
        run: bun run build
      - name: Add SPA fallback
        run: cp dist/client/index.html dist/client/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  # Gate job: only deploy when the tag matches v*-pages (e.g. v0.1.0-pages)
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.eval.outputs.ok }}
    steps:
      - id: eval
        run: |
          TAG="${{ github.event.release.tag_name != '' && github.event.release.tag_name || github.event.inputs.tag }}"
          if [[ "$TAG" =~ ^v.+-pages$ ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$TAG' does not match v*-pages; deploy will be skipped."
          fi

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: [build, check-tag]
    if: needs.check-tag.outputs.ok == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
